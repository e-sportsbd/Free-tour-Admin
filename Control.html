<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Submit</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  body{
    background:#0f0f0f;
    font-family:Poppins, sans-serif;
    color:white;
    padding:15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }

  /* Banner */
  .banner{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:20px;
  }

  #bannerImage{
    width:100%;
    max-width:420px;
    border-radius:20px;
    display:block;
  }

  /* Info Box */
  .topBox{
    max-width:420px;
    width:100%;
    margin:auto;
    background:#1c1c1c;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
  }

  .info{
    margin:8px 0;
    background:#252525;
    padding:10px;
    border-radius:6px;
    font-size:16px;
  }

  /* Form Box */
  .box{
    max-width:420px;
    width:100%;
    background:#1c1c1c;
    padding:20px;
    border-radius:10px;
  }

  .box h2{
    text-align:center;
    margin-bottom:15px;
  }

  input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:6px;
    background:#2d2d2d;
    color:white;
    font-size:16px;
  }

  input[type="file"]{
    background:none;
  }

  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#ff0057;
    color:white;
    font-size:18px;
    margin-top:10px;
    cursor:pointer;
  }
</style>
</head>

<body>

<!-- BANNER -->
<div class="banner">
 <img id="bannerImage" src="banner.png">
</div>

<!-- TOP INFO -->
<div class="topBox">
  <div class="info">📅 Custom Date: <span id="today"></span></div>
  <div class="info">🎯 Total Slots: <span id="totalSlots">0</span></div>
  <div class="info">📌 Total Submissions: <span id="filled">0</span></div>
  <div class="info">Available Slots: <span id="empty">0</span></div>
</div>

<!-- SUBMIT FORM -->
<div class="box">
  <h2>Free Fire Info Submit</h2>

  <input type="text" id="uid" placeholder="Free Fire UID">
  <input type="text" id="nickname" placeholder="Nickname">
  <input type="text" id="ign" placeholder="In-game Name">
  <input type="text" id="whatsapp" placeholder="WhatsApp Number">

  <input type="file" id="logo">

  <button onclick="submitData()">Submit</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBl0PIm4lvZea96Bte3KaKQJvurGE1P8Es",
    authDomain: "noreply@post-c7e41.firebaseapp.com",
    databaseURL: "https://post-c7e41-default-rtdb.firebaseio.com",
    projectId: "post-c7e41",
    storageBucket: "post-c7e41.appspot.com",
    messagingSenderId: "758133068153",
    appId: "1:758133068153:web:28ef27e45d8037e0d49fa8"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // LOAD BANNER
  db.ref("settings/banner").on("value", snap => {
    let banner = snap.val();
    if(banner){
      document.getElementById("bannerImage").src = banner;
    }
  });

  // LOAD CUSTOM DATE
  db.ref("settings/customDate").on("value", snap => {
    let date = snap.val() || "Not Set";
    document.getElementById("today").innerText = date;
  });

  let totalSlots = 0;

  // Load total slots
  db.ref("settings/totalSlots").on("value", snap => {
    totalSlots = snap.val() || 0;
    document.getElementById("totalSlots").innerText = totalSlots;
    updateSlots();
  });

  // Count total players
  db.ref("players").on("value", snap => {
    let filled = snap.numChildren();
    document.getElementById("filled").innerText = filled;
    updateSlots();
  });

  // Update empty slots
  function updateSlots(){
    const filled = Number(document.getElementById("filled").innerText) || 0;
    let empty = totalSlots - filled;
    if(empty < 0) empty = 0;
    document.getElementById("empty").innerText = empty;
  }

  // ImgBB API Key
  const imgbbKey = "88c0bb1467edb4dd6b6c09ab38af1a35";

  function submitData(){
    const uid = document.getElementById("uid").value.trim();
    const nickname = document.getElementById("nickname").value.trim();
    const ign = document.getElementById("ign").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const file = document.getElementById("logo").files[0];

    if(!uid || !nickname || !ign || !whatsapp || !file){
        alert("All fields are required!");
        return;
    }

    let form = new FormData();
    form.append("image", file);

    // Upload image
    fetch("https://api.imgbb.com/1/upload?key=" + imgbbKey, {
        method: "POST",
        body: form
    })
    .then(res => res.json())
    .then(data => {
        if(!data.success){
            alert("Image upload failed!");
            return;
        }

        let imageURL = data.data.url;

        // Save to Firebase
        db.ref("players/" + uid).set({
            uid: uid,
            nickname: nickname,
            ign: ign,
            whatsapp: whatsapp,
            logo: imageURL
        });

        alert("Submitted Successfully!");
    })
    .catch(() => alert("Something went wrong!"));
  }
</script>

</body>
</html>
