<!DOCTYPE html>  <html>  
<head>  
<meta charset="UTF-8">  
<title>Admin Panel</title>  <!-- Firebase -->  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>  <style>  
    body{  
        background:#0d0d0d;  
        color:white;  
        font-family:Poppins, sans-serif;  
        padding:15px;  
    }  
    h2{  
        text-align:center;  
        margin-bottom:15px;  
    }  
  
    .box{  
        max-width:450px;  
        margin:auto;  
        background:#1c1c1c;  
        padding:20px;  
        border-radius:10px;  
        margin-bottom:25px;  
    }  
  
    input{  
        width:100%;  
        padding:12px;  
        margin:10px 0;  
        border:none;  
        border-radius:6px;  
        background:#2d2d2d;  
        color:white;  
        font-size:16px;  
    }  
  
    button{  
        width:100%;  
        padding:12px;  
        margin:8px 0;  
        background:#ff0057;  
        border:none;  
        border-radius:6px;  
        color:white;  
        font-size:18px;  
        cursor:pointer;  
    }  
  
    .card{  
        background:#202020;  
        padding:12px;  
        border-radius:8px;  
        margin:12px 0;  
    }  
  
    .card img{  
        width:90px;  
        height:90px;  
        border-radius:10px;  
        object-fit:cover;  
        margin-bottom:10px;  
    }  
  
    .btnSmall{  
        width:48%;  
        padding:10px;  
        font-size:15px;  
        border:none;  
        border-radius:6px;  
        cursor:pointer;  
        margin-top:8px;  
    }  
    .del{  
        background:#ff0033;  
        color:white;  
    }  
    .ok{  
        background:#00c853;  
        color:white;  
    }  
</style>  </head>  <body>  <div class="box">  
    <h2>Admin Controls</h2>  <label>Update Total Slots:</label>  
<input type="number" id="slotInput" placeholder="Enter total slots">  

<label>Update Banner Image URL:</label>  
<input type="text" id="bannerInput" placeholder="Enter banner image link">  

<label>Update Custom Date:</label>  
<input type="text" id="dateInput" placeholder="Enter custom date (example: 30-11-2025)">  

<button onclick="updateSettings()">Update All Settings</button>

</div>  <div class="box">  
    <h2>All Submissions</h2>  
    <div id="players"></div>  
</div>  <script>  
  const firebaseConfig = {  
    apiKey: "AIzaSyBl0PIm4lvZea96Bte3KaKQJvurGE1P8Es",  
    authDomain: "noreply@post-c7e41.firebaseapp.com",  
    databaseURL: "https://post-c7e41-default-rtdb.firebaseio.com",  
    projectId: "post-c7e41",  
    storageBucket: "post-c7e41.appspot.com",  
    messagingSenderId: "758133068153",  
    appId: "1:758133068153:web:28ef27e45d8037e0d49fa8"  
  };  
  
  firebase.initializeApp(firebaseConfig);  
  const db = firebase.database();  
  
  // Load previous settings  
  db.ref("settings").on("value", snap => {  
      let data = snap.val() || {};  
  
      document.getElementById("slotInput").value = data.totalSlots || "";  
      document.getElementById("bannerInput").value = data.banner || "";  
      document.getElementById("dateInput").value = data.customDate || "";  
  });  
  
  // Update all settings  
  function updateSettings(){  
      const slots = document.getElementById("slotInput").value;  
      const banner = document.getElementById("bannerInput").value;  
      const date = document.getElementById("dateInput").value;  
  
      if(slots === ""){  
          alert("Enter slot number!");  
          return;  
      }  
  
      db.ref("settings").update({  
          totalSlots: Number(slots),  
          banner: banner,  
          customDate: date  
      });  
  
      alert("Settings Updated!");  
  }  
  
  // Load all players  
  db.ref("players").on("value", snap => {  
      let data = snap.val() || {};  
      let box = document.getElementById("players");  
  
      box.innerHTML = "";  
  
      for(let id in data){  
          let p = data[id];  
  
          box.innerHTML += `  
            <div class="card">  
                <img src="${p.logo}">  
                <div><b>UID:</b> ${p.uid}</div>  
                <div><b>Nickname:</b> ${p.nickname}</div>  
                <div><b>IGN:</b> ${p.ign}</div>  
                <div><b>WhatsApp:</b> ${p.whatsapp}</div>  
  
                <div><b>Status:</b>   
                    ${p.status === "accepted"  
                        ? "<span style='color:#00ff6a;font-weight:bold'>Accepted</span>"  
                        : "<span style='color:#ffea00;font-weight:bold'>Pending</span>"  
                    }  
                </div>  
  
                ${p.status === "accepted"  
                    ? `<div><b>Approved On:</b> ${p.approveDate} - ${p.approveTime}</div>`  
                    : ""  
                }  
  
                ${p.status === "accepted"  
                    ? ""  
                    : `<button class="btnSmall ok" onclick="accept('${p.uid}')">Accept</button>`  
                }  
  
                <button class="btnSmall del" onclick="remove('${p.uid}')">Delete</button>  
            </div>  
          `;  
      }  
  });  
  
  // Accept player  
  function accept(uid){  
      const now = new Date();  
      const date = now.toISOString().slice(0,10);  
      const time = now.toLocaleTimeString();  
  
      db.ref("players/"+uid).update({  
          status: "accepted",  
          approveDate: date,  
          approveTime: time  
      });  
  
      alert("Accepted!");  
  }  
  
  // Delete player  
  function remove(uid){  
      db.ref("players/"+uid).remove();  
      alert("Deleted!");  
  }  
</script>  </body>  
</html>
